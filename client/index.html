<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Clipping Department turns long-form content into measurable short-form distribution campaigns for brands, creators, podcasters, and businesses." />
    <meta property="og:title" content="Clipping Department — Make your best content travel" />
    <meta property="og:description" content="Short-form content distribution for brands, creators, and businesses with something worth sharing." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NP" />
    <link rel="canonical" href="https://clippingdepartment.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <title>Clipping Department — Short-form content distribution</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = `${endpoint}/umami`;
        s.setAttribute("data-website-id", websiteId);
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
