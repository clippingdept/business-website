<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="description" content="Clipping Department helps brands, creators, and businesses turn long-form video into short-form clips, AI clipping workflows, and measurable content distribution campaigns." />
    <meta name="keywords" content="AI clipping, video clipping platform, clip creation, short-form video clips, content repurposing, video clipping, clip editor, social media clipping, AI clip maker" />
    <meta property="og:title" content="Clipping Department | AI Clipping & Short-Form Video Campaigns" />
    <meta property="og:description" content="Turn podcasts, interviews, livestreams, and long-form video into AI clipping campaigns that drive reach, engagement, and measurable performance." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NP" />
    <meta property="og:site_name" content="Clipping Department" />
    <meta property="og:image" content="https://clippingdepartment.com/newlogo.svg" />
    <meta property="og:image:alt" content="Clipping Department logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clipping Department | AI Clipping & Short-Form Video Campaigns" />
    <meta name="twitter:description" content="Video clipping platform and AI clip creation services for brands, creators, and businesses." />
    <meta name="twitter:image" content="https://clippingdepartment.com/newlogo.svg" />
    <link rel="canonical" href="https://clippingdepartment.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <title>Clipping Department | AI Clipping & Short-Form Video Campaigns</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Clipping Department",
        "url": "https://clippingdepartment.com/",
        "logo": "https://clippingdepartment.com/newlogo.svg",
        "sameAs": [],
        "description": "AI clipping and short-form video content services for brands, creators, and businesses."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Clipping Department",
        "url": "https://clippingdepartment.com/",
        "description": "Turn long-form content into short-form clips, AI clipping campaigns, and measurable social distribution strategies.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://clippingdepartment.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = `${endpoint}/umami`;
        s.setAttribute("data-website-id", websiteId);
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
